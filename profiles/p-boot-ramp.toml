# profiles/p-boot-ramp.toml -- fresh-boot ramp for p-step3: the same points with every offset clamped to >= -50 mV, so that from a boot (all
# offsets 0) each write stays within the policy's per-operation step (max_offset_step_mv = 55). profiles/CURRENT applies it BEFORE p-step3
# (largest step then: CPU 7 55x -50 -> -97 = 47 mV). On a state where p-step3 is already applied it briefly raises the deep points to -50
# (the safe direction) and p-step3 lowers them again.
[meta]
name = "p-boot-ramp"
platform = "arl-s-285k"

[[point]]
kind = "P"
index = 0
point = 4
offset_mv = 0
expect_ratio = 48

[[point]]
kind = "P"
index = 0
point = 5
offset_mv = -50
expect_ratio = 53

[[point]]
kind = "P"
index = 0
point = 6
offset_mv = -30
expect_ratio = 55

[[point]]
kind = "P"
index = 0
point = 7
offset_mv = -50
expect_ratio = 56

