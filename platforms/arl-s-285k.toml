# Platform file: Intel Core Ultra 9 285K (Arrow Lake-S) on ASRock Z890 Steel Legend WiFi.
# Loaded and validated by arltuner.platform (stdlib tomllib). Only MEASURED / DECOMPILED / DOC facts belong here (AGENTS.md evidence rules);
# source of every table: docs/knowledge/platform-285k.md. Writes are allowed only on a machine that matches this file.
schema = 1

[platform]
id = "arl-s-285k"
name = "Intel Core Ultra 9 285K (Arrow Lake-S)"
board = "ASRock Z890 Steel Legend WiFi"

# CPUID leaf 1 EAX 0xC0662 = family 6, model 0xC6 (198), stepping 2 [MEASURED win 2026-09-30] (platform-285k.md section 1).
# /proc/cpuinfo reports "cpu family" 6, "model" 198, "stepping" 2.
[cpuid]
vendor = "GenuineIntel"
signature = 0xC0662
family = 6
model = 198
stepping = 2

# [MEASURED lnx 2026-09-29] (platform-285k.md section 2): no SMT, P = Linux CPU 0-7, E = 8-23 in clusters of four, favored P = CPU 0 and 3.
[topology]
cpu_core_cpus = "0-7"    # /sys/devices/cpu_core/cpus
cpu_atom_cpus = "8-23"   # /sys/devices/cpu_atom/cpus
p_count = 8
e_count = 16
e_first_cpu = 8
e_cluster_size = 4
favored_p = [0, 3]
# Windows logical processor of each Linux CPU, P ordinal order and E ordinal order [MEASURED win 2026-10-01] (order-preserving map).
lp_p = [0, 1, 10, 11, 12, 13, 22, 23]
lp_e = [2, 3, 4, 5, 6, 7, 8, 9, 14, 15, 16, 17, 18, 19, 20, 21]

# Fused V/F point ratios, P2 = 1..n of cmd 0x10 / 0x11 [MEASURED lnx 2026-10-02] (platform-285k.md section 3).
# The ring has a 9th point (40x) only while the ring OC ratio is 40x.
[vf_points]
p = [8, 20, 30, 48, 53, 55, 56, 57]
e = [8, 15, 23, 30, 40, 46]
ring = [8, 14, 20, 28, 34, 37, 38, 39]

# Fused V/F point word, cmd 0x09 P1=0x11 P2=0 per CPU (ratio [7:0], voltage [19:8] S2.10) [MEASURED win 2026-10-01 / lnx 2026-10-02].
# Distinct per physical P-core: this is the identity check. E clusters: CPU 8-11 and CPU 12-23 share a word.
[fused_point]
p = [0x5B439, 0x53839, 0x57439, 0x59439, 0x54439, 0x56C39, 0x56039, 0x58039]
e_first_cluster = 0x4A02E   # CPU 8-11
e_other_clusters = 0x48C2E  # CPU 12-23

# Stock turbo tables, plain MSRs on CPU 0 [MEASURED lnx 2026-09-29, same 2026-10-01] (platform-285k.md section 9).
[turbo]
msr_0x1AD = 0x3737373737373939  # P ratio by active-core bucket 1..8, LSB first: 57,57,55 x6
msr_0x1AE = 0x0807060504030201  # P bucket core counts (read-only by policy)
msr_0x650 = 0x3030303030303030  # E ratios 48 x8
msr_0x651 = 0x100C080604030201  # E bucket core counts (read-only by policy)

# Sensors: temperatures from coretemp; Vcore from the board Super-I/O via hwmon (read-only files). The exact Nuvoton chip name is not recorded
# in the knowledge base, so it is left empty rather than guessed.
[sensors]
temp_hwmon_name = "coretemp"
vcore_hwmon_vendor = "Nuvoton"
vcore_hwmon_name = ""
