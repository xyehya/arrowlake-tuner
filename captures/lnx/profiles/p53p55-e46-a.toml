# p53p55-e46 step A (2026-10-19, PASSED 15/15 compile stress uv-p53p55-e46): P offsets (53x <= 1.200 V, 55x 1.270 V, accepted 56/57x on P0/P3),
# P turbo buckets 1-2 lowered to 55, E turbo 46x8, E point 6 offset 0 (stock). Apply after a boot, then step B. Script: tools-local apply-p53p55-e46.sh
[meta]
name = "p53p55-e46-a"
platform = "arl-s"

[turbo]
p = [55, 55, 54, 54, 54, 54, 54, 54]  # step A lowers P buckets 1-2 (BIOS 57 -> 55); step B raises 3-8 (54 -> 55)
