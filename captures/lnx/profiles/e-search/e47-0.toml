# e47-0: E 47x OC  EC0 1057 mV / EC1-3 1037 mV; P0 OC 58x at 1426 mV (fused 57x V); turbo P 58,58,55x6 E 47x8; rest = good-p53p55-fav-e46m100
# good-p53p55-fav-e46m100 — KNOWN-GOOD state (2026-10-19), restorable any time:
#  P: 53x <= 1.200 V, 55x 1.270 V group, P0/P3 56x -15 / 57x -75 mV (57x clamps to V(56x)), P turbo 57/57/55x6
#     passed 15/15 all-core compile (uv-p53p55-e46), 2/2 all-core (uv-fav5675), 1 build pinned to P0+P3, stress-ng P0+P3 at 56x/57x.
#  E: 46x, point 6 -100 mV all clusters, E turbo 46x8 — PASSED 15/15 all-core compile (e46m100-x15, 2026-10-20). -120 failed at build 13 (EC3 cpu 21).
#  Leaves any existing E OC point in place (only a cold boot clears one); the 46x8 E table keeps E at 46x regardless.
[meta]
name = "e47-0"
platform = "arl-s"

[turbo]
p = [58, 58, 55, 55, 55, 55, 55, 55]  # P0 58x OC at 1-2 active cores, all-core 55x
e = [47, 47, 47, 47, 47, 47, 47, 47]  # E 47x via the OC point

